name: orders-analytics

x-pinot-image: &pinot-image apachepinot/pinot:1.3.0

services:
  # ---------------------------------------------------------------- Kafka (KRaft, no ZooKeeper)
  kafka:
    image: apache/kafka:3.8.0
    container_name: kafka
    ports:
      - "29092:29092" # host listener (python apps on your laptop)
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:29092,CONTROLLER://:9093
      # INTERNAL = docker network (Pinot, kafka-ui); EXTERNAL = host machine
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_RETENTION_HOURS: 24
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12

  kafka-init:
    image: apache/kafka:3.8.0
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        T=/opt/kafka/bin/kafka-topics.sh
        B=kafka:9092
        # 6 partitions = max consumer parallelism; key = order_id keeps per-order ordering
        $$T --bootstrap-server $$B --create --if-not-exists --topic orders.raw      --partitions 6 --replication-factor 1
        $$T --bootstrap-server $$B --create --if-not-exists --topic orders.enriched --partitions 6 --replication-factor 1
        $$T --bootstrap-server $$B --create --if-not-exists --topic orders.dlq      --partitions 1 --replication-factor 1 --config retention.ms=604800000
        # sandbox topics used by examples/kafka/*.py
        $$T --bootstrap-server $$B --create --if-not-exists --topic demo.events     --partitions 3 --replication-factor 1
        $$T --bootstrap-server $$B --create --if-not-exists --topic demo.events.out --partitions 3 --replication-factor 1
        $$T --bootstrap-server $$B --list

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092

  # ---------------------------------------------------------------- Pinot
  zookeeper:
    image: zookeeper:3.9.2
    container_name: zookeeper
    healthcheck:
      test: ["CMD-SHELL", "echo ruok | nc localhost 2181 | grep imok"]
      interval: 10s
      timeout: 5s
      retries: 10

  pinot-controller:
    image: *pinot-image
    container_name: pinot-controller
    command: "StartController -zkAddress zookeeper:2181"
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9000:9000" # Pinot UI + REST
    environment:
      JAVA_OPTS: "-Xms512M -Xmx1G -XX:+UseG1GC"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10

  pinot-broker:
    image: *pinot-image
    container_name: pinot-broker
    command: "StartBroker -zkAddress zookeeper:2181"
    depends_on:
      pinot-controller:
        condition: service_healthy
    ports:
      - "8099:8099" # SQL query endpoint
    environment:
      JAVA_OPTS: "-Xms512M -Xmx1G -XX:+UseG1GC"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8099/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10

  pinot-server:
    image: *pinot-image
    container_name: pinot-server
    command: "StartServer -zkAddress zookeeper:2181"
    depends_on:
      pinot-broker:
        condition: service_healthy
    environment:
      JAVA_OPTS: "-Xms1G -Xmx2G -XX:+UseG1GC"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8097/health/readiness || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10

  # one-shot: registers schemas + realtime tables (idempotent: -exec with overwrite)
  pinot-init:
    image: *pinot-image
    depends_on:
      pinot-server:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    restart: "no"
    volumes:
      - ./pinot:/config:ro
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        for t in order_events orders_state; do
          /opt/pinot/bin/pinot-admin.sh AddTable \
            -schemaFile /config/$$t.schema.json \
            -tableConfigFile /config/$$t.table.json \
            -controllerHost pinot-controller -controllerPort 9000 \
            -update -exec
        done
